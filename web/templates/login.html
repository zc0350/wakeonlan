<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wake-on-LAN · 登录</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="login-wrap">
    <form class="login-card" id="loginForm">
      <h1>Wake-on-LAN 管理后台</h1>
      <div class="sub">请登录以管理局域网设备</div>
      <div class="field">
        <label>用户名</label>
        <input type="text" id="username" autocomplete="username" required>
      </div>
      <div class="field">
        <label>密码</label>
        <input type="password" id="password" autocomplete="current-password" required>
      </div>
      <button class="btn btn-primary" type="submit" style="width:100%">登录</button>
      <div id="err" style="color:var(--danger);margin-top:12px;font-size:13px;"></div>
    </form>
  </div>
  <script>
    const form = document.getElementById('loginForm');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const errEl = document.getElementById('err');
      errEl.textContent = '';
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        if (res.ok) {
          window.location.href = '/';
          return;
        }
        const data = await res.json().catch(() => ({}));
        errEl.textContent = data.error || '登录失败';
      } catch (e) {
        errEl.textContent = '网络错误，请重试';
      }
    });
  </script>
</body>
</html>
